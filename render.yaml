# Render Blueprint — free Django API for the 1Fi Marketplace.
# Dashboard: New + → Blueprint → connect this repo.
services:
  - type: web
    name: 1fi-marketplace-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    # migrate + seed run on every container start because the free tier has no
    # persistent disk (SQLite resets). seed is idempotent. Orders don't survive
    # a restart — fine for a demo.
    startCommand: "python manage.py migrate --no-input && python manage.py seed && { python manage.py createsuperuser --no-input || true; } && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOW_ALL
        value: "false"
      # Set this after the Vercel frontend is live, e.g.
      # https://1fi-marketplace.vercel.app  (no trailing slash)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Admin login for the reseeded DB. Set these in the dashboard.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
